<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>机器学习 9 考点</title>
<link rel="stylesheet" href="katex/katex.min.css">
<style>
/* ========== 主题变量 ========== */
html[data-theme="light"]{
  --bg:#f5f7fa; --panel:#ffffff; --panel2:#eef2f7; --fg:#141a21; --fg2:#3d4a58;
  --muted:#6b7885; --line:#dfe5ec; --accent:#2563eb; --accent2:#0e9f6e;
  --warn:#d97706; --danger:#dc2626; --grid:#c9d3dd; --shadow:0 1px 3px rgba(16,24,40,.08),0 1px 2px rgba(16,24,40,.04);
  --chip:#e8eef8; --chipfg:#1d4ed8;
}
html[data-theme="dark"]{
  --bg:#0e1318; --panel:#161d24; --panel2:#1d262e; --fg:#e7edf3; --fg2:#c2cdd8;
  --muted:#8fa0b0; --line:#26313b; --accent:#6aa5ff; --accent2:#34d399;
  --warn:#fbbf24; --danger:#f87171; --grid:#33414d; --shadow:0 1px 3px rgba(0,0,0,.5);
  --chip:#1c2b3f; --chipfg:#9ec5ff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--fg);
  font-family:-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  font-size:15px; line-height:1.65;
  -webkit-text-size-adjust:100%;
  padding-bottom:calc(64px + env(safe-area-inset-bottom));
  transition:background .18s,color .18s;
}
/* ========== 顶栏 ========== */
#topbar{
  position:sticky; top:0; z-index:50; display:flex; align-items:center; gap:8px;
  padding:calc(6px + env(safe-area-inset-top)) 12px 6px;
  background:var(--panel); border-bottom:1px solid var(--line);
}
#topbar h1{font-size:15px; margin:0; flex:1; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.iconbtn{
  border:1px solid var(--line); background:var(--panel2); color:var(--fg);
  width:38px; height:38px; border-radius:10px; font-size:17px; cursor:pointer;
  display:flex; align-items:center; justify-content:center; flex:0 0 auto;
}
.iconbtn:active{transform:scale(.94)}
/* ========== 主区 ========== */
main{padding:12px 12px 20px; max-width:760px; margin:0 auto}
h2{font-size:19px; margin:4px 0 2px; line-height:1.35}
.sub{color:var(--muted); font-size:12.5px; margin:0 0 14px}
h3{font-size:15px; margin:20px 0 8px; color:var(--fg); border-left:3px solid var(--accent); padding-left:8px}
h4{font-size:13.5px; margin:14px 0 6px; color:var(--fg2)}
p{margin:8px 0}
small{color:var(--muted); font-size:12px}
code,.mono{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace}
code{background:var(--panel2); padding:1px 5px; border-radius:5px; font-size:12.5px}
/* ========== 卡片 ========== */
.card{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px; margin:12px 0; box-shadow:var(--shadow)}
.grid{display:grid; gap:10px}
@media(min-width:520px){ .grid.two{grid-template-columns:1fr 1fr} }
/* 首页考点卡 */
.tile{
  background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:13px 14px;
  display:flex; gap:12px; align-items:flex-start; cursor:pointer; box-shadow:var(--shadow);
  transition:transform .12s,border-color .12s;
}
.tile:active{transform:scale(.985); border-color:var(--accent)}
.tile .n{
  flex:0 0 auto; width:30px; height:30px; border-radius:9px; background:var(--chip); color:var(--chipfg);
  font-weight:700; font-size:14px; display:flex; align-items:center; justify-content:center;
}
.tile .t{font-weight:600; font-size:14.5px; margin-bottom:2px}
.tile .d{color:var(--muted); font-size:12px; line-height:1.5}
.tile .badge{font-size:10.5px; padding:1px 6px; border-radius:6px; background:var(--warn); color:#fff; margin-left:6px; vertical-align:2px}
/* ========== 控件 ========== */
.row{display:flex; align-items:center; gap:10px; margin:10px 0; flex-wrap:wrap}
.row label{font-size:12.5px; color:var(--muted); flex:0 0 auto; min-width:64px}
input[type=range]{
  -webkit-appearance:none; appearance:none; flex:1; height:34px; background:transparent; min-width:120px;
}
input[type=range]::-webkit-slider-runnable-track{height:5px; background:var(--panel2); border-radius:3px; border:1px solid var(--line)}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none; width:22px; height:22px; border-radius:50%; background:var(--accent);
  margin-top:-9px; border:2px solid var(--panel); box-shadow:0 1px 4px rgba(0,0,0,.3);
}
input[type=range]::-moz-range-track{height:5px; background:var(--panel2); border-radius:3px}
input[type=range]::-moz-range-thumb{width:20px; height:20px; border:2px solid var(--panel); border-radius:50%; background:var(--accent)}
.val{font-family:ui-monospace,Consolas,monospace; font-size:13px; color:var(--accent); min-width:52px; text-align:right; font-weight:600}
.btn{
  border:1px solid var(--line); background:var(--panel2); color:var(--fg);
  padding:9px 14px; border-radius:10px; font-size:13.5px; cursor:pointer; font-weight:500;
  min-height:40px; display:inline-flex; align-items:center; justify-content:center; gap:6px;
}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent); color:#fff; border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px; min-height:32px; font-size:12.5px}
.btn.on{background:var(--accent); color:#fff; border-color:var(--accent)}
.btn:disabled{opacity:.45}
.seg{display:inline-flex; border:1px solid var(--line); border-radius:10px; overflow:hidden; background:var(--panel2)}
.seg button{
  border:0; background:transparent; color:var(--fg2); padding:8px 12px; font-size:12.5px;
  cursor:pointer; min-height:36px; border-right:1px solid var(--line);
}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent); color:#fff; font-weight:600}
/* ========== 表格 ========== */
.tbl{width:100%; border-collapse:collapse; font-size:12.5px; margin:8px 0}
.tbl th,.tbl td{border:1px solid var(--line); padding:6px 7px; text-align:right}
.tbl th{background:var(--panel2); font-weight:600; color:var(--fg2); text-align:center}
.tbl td:first-child,.tbl th:first-child{text-align:left}
.tbl tr.hi td{background:var(--chip); font-weight:600}
.tbl td.num{font-family:ui-monospace,Consolas,monospace}
/* ========== 公式块 ========== */
.formula{
  background:var(--panel2); border-radius:10px; padding:11px 13px; margin:9px 0;
  font-family:ui-monospace,Consolas,"DejaVu Sans Mono",monospace; font-size:13px;
  line-height:1.9; overflow-x:auto; white-space:pre-wrap; word-break:break-word; color:var(--fg);
}
/* ========== 提示条 ========== */
.note{
  border-left:3px solid var(--accent); background:var(--panel2); border-radius:0 9px 9px 0;
  padding:9px 12px; margin:10px 0; font-size:13px; color:var(--fg2);
}
.note.warn{border-left-color:var(--warn)}
.note.danger{border-left-color:var(--danger)}
.note.ok{border-left-color:var(--accent2)}
.note b{color:var(--fg)}
/* ========== canvas ========== */
canvas{display:block; width:100%; border-radius:10px; background:var(--panel2); touch-action:pan-y}
/* ========== 矩阵 ========== */
.mat{display:inline-grid; gap:3px; vertical-align:middle}
.mat span{
  min-width:38px; height:34px; display:flex; align-items:center; justify-content:center;
  background:var(--panel2); border:1px solid var(--line); border-radius:6px;
  font-family:ui-monospace,Consolas,monospace; font-size:12.5px; transition:all .22s;
}
.mat span.act{background:var(--accent); color:#fff; border-color:var(--accent); font-weight:700; transform:scale(1.06)}
.mat span.out{background:var(--accent2); color:#fff; border-color:var(--accent2); font-weight:700}
.mat span.zero{color:var(--muted)}
.matwrap{display:flex; gap:12px; align-items:center; flex-wrap:wrap; justify-content:center; margin:10px 0}
.matlabel{font-size:11px; color:var(--muted); text-align:center; margin-top:4px}
/* ========== 底栏 ========== */
#tabbar{
  position:fixed; left:0; right:0; bottom:0; z-index:50; display:flex;
  background:var(--panel); border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
#tabbar button{
  flex:1; border:0; background:transparent; color:var(--muted); padding:9px 4px 8px;
  font-size:10.5px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:2px;
}
#tabbar button .ic{font-size:17px; line-height:1}
#tabbar button.on{color:var(--accent); font-weight:600}
/* ========== 进度条 ========== */
.pbar{height:5px; background:var(--panel2); border-radius:3px; overflow:hidden; margin:6px 0}
.pbar>i{display:block; height:100%; background:var(--accent); border-radius:3px; transition:width .25s}
/* ========== 单选题 ========== */
.q{margin:14px 0; padding-bottom:12px; border-bottom:1px dashed var(--line)}
.q:last-child{border-bottom:0}
.q .qt{font-size:13.5px; font-weight:600; margin-bottom:8px}
.opt{
  display:block; width:100%; text-align:left; border:1px solid var(--line); background:var(--panel2);
  color:var(--fg); padding:10px 12px; border-radius:9px; margin:6px 0; font-size:13px; cursor:pointer;
  line-height:1.5;
}
.opt:active{transform:scale(.99)}
.opt.right{border-color:var(--accent2); background:color-mix(in srgb,var(--accent2) 16%,var(--panel)); font-weight:600}
.opt.wrong{border-color:var(--danger); background:color-mix(in srgb,var(--danger) 16%,var(--panel))}
.opt .mk{float:right; font-weight:700}
.expl{font-size:12.5px; color:var(--fg2); background:var(--panel2); border-radius:8px; padding:9px 11px; margin-top:7px; display:none}
.expl.show{display:block}
.hidden{display:none !important}
.kv{display:flex; justify-content:space-between; gap:8px; padding:4px 0; font-size:13px; border-bottom:1px dotted var(--line)}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--muted)}
.kv .v{font-family:ui-monospace,Consolas,monospace; font-weight:600; color:var(--accent)}
.tag{display:inline-block; font-size:11px; padding:1px 7px; border-radius:6px; background:var(--chip); color:var(--chipfg); margin-right:5px}
/* ========== 数学公式（KaTeX） ========== */
.math{background:var(--panel2); border-radius:10px; padding:12px 14px; margin:9px 0; overflow-x:auto; overflow-y:hidden}
.math .katex{font-size:1.06em}
.math .katex-display{margin:0}
.math-inline .katex{font-size:1.02em}
.mathblock{
  background:var(--panel2); border-radius:10px; padding:12px 14px; margin:9px 0;
  overflow-x:auto; overflow-y:hidden;
}
.mathblock .katex-display{margin:.2em 0}
.mathblock .katex{font-size:1.05em}
/* 逐步演算的旁注 */
.calc{background:var(--panel); border:1px solid var(--line); border-radius:12px; margin:12px 0; overflow:hidden}
.calc .ch{background:var(--chip); color:var(--chipfg); padding:9px 13px; font-size:13px; font-weight:600}
.calc .cb{padding:4px 13px 12px}
.cstep{margin:12px 0; padding-left:11px; border-left:2px solid var(--line)}
.cstep .lbl{font-size:12px; color:var(--accent); font-weight:700; margin-bottom:5px}
.cstep .eq{overflow-x:auto; padding:2px 0}
.cstep .eq .katex{font-size:1.02em}
.cstep .note{font-size:12.5px; color:var(--fg2); line-height:1.65; margin-top:6px;
  background:var(--panel2); border-radius:8px; padding:8px 10px}
.cstep .note b{color:var(--fg)}
.cstep .res{font-size:13px; color:var(--accent2); font-weight:600; margin-top:5px}
/* ========== 练习题（可折叠答案） ========== */
.ex{background:var(--panel2); border-radius:11px; padding:12px 13px; margin:12px 0; border-left:3px solid var(--accent)}
.exq{font-size:13.5px; line-height:1.75; color:var(--fg)}
.exq .exn{display:inline-block; background:var(--accent); color:#fff; font-size:11.5px; font-weight:700;
  padding:1px 8px; border-radius:6px; margin-right:7px; vertical-align:1px}
.exq .tag2{display:inline-block; background:var(--chip); color:var(--chipfg); font-size:11px;
  padding:0 6px; border-radius:5px; margin-left:4px}
.exa{margin-top:10px; border-top:1px dashed var(--line); padding-top:8px}
.exa>summary{cursor:pointer; font-size:12.5px; color:var(--accent); font-weight:600; padding:3px 0; list-style:none}
.exa>summary::-webkit-details-marker{display:none}
.exa>summary::before{content:"▸ "; font-size:11px}
.exa[open]>summary::before{content:"▾ "}
.exa .ans{font-size:13px; color:var(--accent2); font-weight:600; margin:8px 0 4px}
.exa .cstep{border-left-color:var(--line); padding-left:10px; margin:10px 0}
.exa .cstep .lbl{font-size:11.5px}
/* ========== 解释块（讲原理用） ========== */
.explain{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px; margin:12px 0; box-shadow:var(--shadow)}
.explain h4{margin:0 0 10px; font-size:14.5px; color:var(--accent); display:flex; align-items:center; gap:7px;
  border-left:0; padding-left:0}
.explain h4::before{content:"?"; flex:0 0 auto; width:19px; height:19px; border-radius:50%;
  background:var(--accent); color:#fff; font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center}
.explain p{margin:9px 0; font-size:13.5px; line-height:1.7}
.explain p:first-of-type{margin-top:0}
.why{background:var(--panel2); border-radius:10px; padding:11px 13px; margin:9px 0; font-size:13px; line-height:1.7;
  border-left:3px solid var(--accent2)}
.why b{color:var(--fg)}
.why .lbl{color:var(--accent2); font-weight:700; font-size:12px; display:block; margin-bottom:3px}
.analogy{background:color-mix(in srgb, var(--warn) 12%, var(--panel)); border-left:3px solid var(--warn);
  border-radius:0 10px 10px 0; padding:11px 13px; margin:9px 0; font-size:13px; line-height:1.7}
.analogy .lbl{color:var(--warn); font-weight:700; font-size:12px; display:block; margin-bottom:3px}
.steps{margin:10px 0}
.steps .st{display:flex; gap:10px; margin:11px 0; align-items:flex-start}
.steps .st .n{flex:0 0 auto; width:21px; height:21px; border-radius:50%; background:var(--accent); color:#fff;
  font-size:11.5px; font-weight:700; display:flex; align-items:center; justify-content:center; margin-top:3px}
.steps .st .c{flex:1; font-size:13px; line-height:1.7}
.steps .st .c b{color:var(--fg)}
.term{color:var(--accent); font-weight:600}
.deriv{background:var(--panel2); border-radius:10px; padding:11px 13px; margin:9px 0;
  font-family:ui-monospace,Consolas,monospace; font-size:12.5px; line-height:2.1; overflow-x:auto;
  white-space:pre-wrap; word-break:break-word; color:var(--fg)}
.deriv .cm{color:var(--muted); font-style:normal}
</style>
</head>
<body>

<header id="topbar">
  <button class="iconbtn" id="btnBack" title="返回">‹</button>
  <h1 id="crumb">机器学习 9 考点</h1>
  <button class="iconbtn" id="btnTheme" title="切换主题">◐</button>
</header>

<main id="view"></main>

<nav id="tabbar">
  <button data-tab="home" class="on"><span class="ic">▦</span>考点</button>
  <button data-tab="test"><span class="ic">✓</span>自测</button>
  <button data-tab="cheat"><span class="ic">⚡</span>速查</button>
  <button data-tab="about"><span class="ic">ⓘ</span>关于</button>
</nav>

<script src="katex/katex.min.js"></script>
<script>
"use strict";
/* =========================================================
   KaTeX 数学公式
   ========================================================= */
function K(t, block){
  try{
    return katex.renderToString(t, { displayMode: !!block, throwOnError: false, strict: false });
  }catch(e){
    return '<span style="color:#dc2626">[公式错误] ' + t + '</span>';
  }
}
/** 块级公式 */
function MB(t){ return '<div class="mathblock">' + K(t, true) + '</div>'; }
/** 行内公式 */
function MI(t){ return '<span class="math-inline">' + K(t, false) + '</span>'; }
/** 一步演算：标签 + 公式 + 旁注 */
function STEP(label, tex, note, res){
  return '<div class="cstep"><div class="lbl">' + label + '</div>' +
    '<div class="eq">' + K(tex, true) + '</div>' +
    (note ? '<div class="note">' + note + '</div>' : '') +
    (res ? '<div class="res">' + res + '</div>' : '') + '</div>';
}
/** 练习题：题干 + 可折叠的答案与步骤 */
function EX(n, q, ansHtml){
  return '<div class="ex">' +
    '<div class="exq"><span class="exn">题 ' + n + '</span>' + q + '</div>' +
    '<details class="exa"><summary>点开看答案与完整步骤</summary>' + ansHtml + '</details>' +
    '</div>';
}
/* =========================================================
   0. 主题
   ========================================================= */
var THEME_KEY = "ml9.theme";
function systemDark(){ return window.matchMedia && matchMedia("(prefers-color-scheme:dark)").matches; }
function resolveTheme(){
  var t = localStorage.getItem(THEME_KEY) || "auto";
  if (t === "auto") return systemDark() ? "dark" : "light";
  return t;
}
function cssVar(name){
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}
function applyTheme(){
  var t = resolveTheme();
  document.documentElement.setAttribute("data-theme", t);
  var bg = cssVar("--bg");
  // 同步原生状态栏；light=深色图标
  try{
    if (window.AndroidHost && AndroidHost.applyChrome){
      AndroidHost.applyChrome(bg, t === "light");
    }
  }catch(e){}
  redrawAll();
}
function cycleTheme(){
  var cur = localStorage.getItem(THEME_KEY) || "auto";
  var next = cur === "auto" ? "light" : (cur === "light" ? "dark" : "auto");
  localStorage.setItem(THEME_KEY, next);
  applyTheme();
  toast(next === "auto" ? "主题：跟随系统" : (next === "light" ? "主题：浅色" : "主题：深色"));
}

/* =========================================================
   1. 工具
   ========================================================= */
function el(tag, cls, html){
  var d = document.createElement(tag);
  if (cls) d.className = cls;
  if (html != null) d.innerHTML = html;
  return d;
}
function fmt(x, n){ n = (n === undefined) ? 3 : n; return (Math.abs(x) < 1e-12 ? 0 : x).toFixed(n); }
function toast(msg){
  var t = document.getElementById("__toast");
  if (!t){
    t = el("div", ""); t.id = "__toast";
    t.style.cssText = "position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));"+
      "background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:20px;font-size:13px;z-index:999;"+
      "opacity:0;transition:opacity .22s;pointer-events:none;max-width:80%;text-align:center";
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = "1";
  clearTimeout(t._tm);
  t._tm = setTimeout(function(){ t.style.opacity = "0"; }, 1500);
}
/* canvas 高清绘制 + 主题切换自动重绘 */
var CANVASES = [];
function mkCanvas(h){
  var c = document.createElement("canvas");
  c.style.height = h + "px";
  CANVASES.push(c);
  return c;
}
function draw(c, fn){
  c._fn = fn;
  paint(c);
}
function paint(c){
  if (!c.isConnected || !c._fn) return;
  var dpr = window.devicePixelRatio || 1;
  var w = c.clientWidth || 300, h = c.clientHeight || 150;
  c.width = Math.round(w * dpr); c.height = Math.round(h * dpr);
  var ctx = c.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  c._fn(ctx, w, h);
}
function redrawAll(){
  for (var i = 0; i < CANVASES.length; i++) paint(CANVASES[i]);
}
window.addEventListener("resize", function(){ setTimeout(redrawAll, 60); });
if (window.matchMedia){
  try{
    matchMedia("(prefers-color-scheme:dark)").addEventListener("change", function(){
      if ((localStorage.getItem(THEME_KEY) || "auto") === "auto") applyTheme();
    });
  }catch(e){}
}

/* 圆角矩形路径。
   canvas 原生 ctx.roundRect 在 Android WebView 较旧版本上不存在，
   自己用二次曲线画一遍，任何版本都能用。 */
function roundRect(ctx, x, y, w, h, r){
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

/* 画坐标系 */
function axes(ctx, w, h, pad, xmin, xmax, ymin, ymax){  var X = function(v){ return pad.l + (v - xmin) / (xmax - xmin) * (w - pad.l - pad.r); };
  var Y = function(v){ return h - pad.b - (v - ymin) / (ymax - ymin) * (h - pad.t - pad.b); };
  ctx.strokeStyle = cssVar("--grid"); ctx.lineWidth = 1;
  ctx.beginPath();
  if (ymin <= 0 && ymax >= 0){ ctx.moveTo(X(xmin), Y(0)); ctx.lineTo(X(xmax), Y(0)); }
  if (xmin <= 0 && xmax >= 0){ ctx.moveTo(X(0), Y(ymin)); ctx.lineTo(X(0), Y(ymax)); }
  ctx.stroke();
  return { X: X, Y: Y };
}

/* 从 CSS 变量取色 */
function col(n){ return cssVar("--" + n); }

SECTIONS.push({

  desc: "两层仿射等于一层、XOR 分不开、激活函数怎么处理数字",
  render: function(root){
    root.appendChild(el("h2", null, "03 · 神经网络为什么非得有非线性"));

      '<p>一个神经元做两件事，只做两件：</p>' +
      '<p><b>第一步</b>：加权求和（再偏一点），也就是画一条直线。</p>' +
      MB('z = w_1x_1 + w_2x_2 + \\cdots + b') +
      '<p><b>第二步</b>：过一道非线性函数，也就是把这条线掰弯。</p>' +
      MB('h = \\varphi(z)') +
      '<p>第一步是「画一条线」（严格说叫<span class="term">仿射映射</span>，就是直线加偏移）。' +
      '第二步是「把这条线掰弯」。</p>' +
      '<div class="analogy"><span class="lbl">打个比方</span>' +
      '只有第一步的神经元像一把<b>直尺</b>——不管你怎么摆，它只能画直线。<br>' +
      '加上第二步，就像给直尺装了一个<b>折弯的关节</b>，它就能画折线、曲线。<br>' +
      '一大堆直尺叠在一起，还是只能画一条直线（下面有证明）。但一堆会折弯的尺子叠起来，就能拼出任何形状。</div>' +
      '<p><b>为什么「堆直尺」没用？</b>这是考试要写的证明，但直觉很简单：' +
      '两层都只做「乘系数再加偏移」，合起来还是「乘系数再加偏移」。' +
      '就像 <b>3×(2x+1)+4</b> 展开还是 <b>6x+7</b>，绕一圈还是直线。' +
      '数学上：W₂(W₁x + b₁) + b₂ = (W₂W₁)x + (W₂b₁ + b₂)，右边仍然是一个矩阵乘 x 再加向量。</p>' +
      '<div class="why"><span class="lbl">所以非线性的真正作用是什么</span>' +

      'ReLU(z) = max(0, z)：z 是正的时候原样放行，是负的时候直接归零。' +
      '这一刀「切」下去，输入空间就被分成两半，两半走的路不一样了。<br>' +
      '折的次数越多，能拼出的形状越复杂。这就是「深层网络能拟合任意函数」的直观来源。</div>';
    root.appendChild(ex);

    /* --- 仿射合并 --- */
    root.appendChild(el("h3", null, "① 两层仿射串联 = 一层"));
    var ex3b = el("div", "explain");
    ex3b.innerHTML =

      '<p>把 h 代进去（这一步就是把第一个式子塞进第二个式子的 h 位置）：</p>' +

      '<p>然后展开括号。注意矩阵乘法的分配律（和普通乘法一样）：</p>' +

}

          '= -0.2\\times(-2.32193) - 0.8\\times(-0.32193) = 0.46439 + 0.25754 \\approx \\mathbf{0.7219}',
          '<b>这个数要记住</b>：(0.8, 0.2) 这种分布熵约 0.722。', 'H₂ ≈ 0.72193') +
        STEP('④ 条件熵：按组占比加权',
          'H(D\\mid A) = \\frac{3}{8}\\times 0 + \\frac{5}{8}\\times 0.7219 = 0.625\\times 0.7219 \\approx \\mathbf{0.451}',
          '总人数 8：第一组 3 人（占 3/8），第二组 5 人（占 5/8）。', 'H(D|A) ≈ 0.45121') +
        STEP('⑤ 信息增益',
          'g = 1 - 0.451 = \\mathbf{0.549}',
          '从最大熵 1 降到了 0.451，消灭了一半多的乱度。', 'g ≈ 0.54879') +
        STEP('⑥ 划分熵：只看 3:5',
          'HA = -\\frac38\\log_2\\frac38 - \\frac58\\log_2\\frac58',
          '再次强调：这一步和标签无关，只看组大小。', '') +
        STEP('　继续算',
          '= -0.375\\times(-1.41504) - 0.625\\times(-0.67807) \\approx \\mathbf{0.954}',
          '', 'HA ≈ 0.95443') +
        STEP('⑦ 增益比',
          'g_R = \\frac{0.549}{0.954} \\approx \\mathbf{0.575}',
          '', 'gR ≈ 0.5755') +
        '<div class="note ok"><b>完整答案</b><br>' +
        'H(D)=1　H(D|A)=0.451　g=0.549　HA=0.954　gR=0.575</div>' +
        '<div class="note"><b>对比另一个特征的例子（体会差异）</b><br>' +
        '若特征 B 分成 (3正,1负) 和 (1正,3负)（各 4 人）：<br>' +
        '两组熵都是 0.811 → H(D|B) = 0.811，g = 0.189，HA(4:4) = 1，gR = 0.189。<br>' +
        'A 的增益 0.549 远大于 B 的 0.189，所以<b>选 A</b>。</div>') +
      EX(3,
        '<b>（a）计算分布 (0.8, 0.2) 的熵。</b><br>' +
        '<b>（b）为什么熵的单位叫「bit」？用"概率 1/8 的事件"说明。</b><br>' +
        '<b>（c）若有 K 个类别且完全均匀，熵是多少？</b>',
        '<div class="ans">答案：（a）≈ 0.722 bit　（b）因为答案是最优编码长度　（c）log₂K</div>' +
        STEP('（a）① 代入熵公式',
          'H = -0.8\\log_2 0.8 - 0.2\\log_2 0.2',
          '', '') +
        STEP('（a）② 查两个对数值',
          '\\log_2 0.8 = -0.32193,\\qquad \\log_2 0.2 = -2.32193',
          '<b>这两个数最好记住</b>，决策树题目里反复出现。', '') +
        STEP('（a）③ 算出结果',
          'H = 0.8\\times 0.32193 + 0.2\\times 2.32193 = 0.25754 + 0.46439 \\approx \\mathbf{0.722}',
          '两个负号都抵消了，结果为正。<br>' +
          '<b>合理性检查：</b>0.722 比最大值 1 bit 小，因为 8:2 比 5:5 更容易猜。✓', 'H ≈ 0.722 bit') +
        STEP('（b）④ 用具体例子看"bit"是什么意思',
          '\\text{事件概率} = \\frac18 \\;\\Rightarrow\\; -\\log_2\\frac18 = \\log_2 8 = \\mathbf{3}',
          '为什么是 3？因为 ' + MI('2^3 = 8') + '。<br>' +
          '<b>8 种等可能里面挑 1 个，用二分法问 3 次就能确定</b>（每次把可能性砍半：8→4→2→1）。<br>' +
          '所以「3 bit」的实际含义是：<b>需要 3 个是/否的回答</b>。', '信息量 = 3 bit') +
        STEP('（b）⑤ 推广一步',
          'H = -\\sum_k p_k\\log_2 p_k \\;\\text{的单位就是 bit}',
          '因为每一项 ' + MI('-\\log_2 p') + ' 都是 bit，加权平均当然还是 bit。<br>' +
          '<b>熵的物理意义：用最优编码方案编这个分布，平均每条消息要几位二进制。</b>', '') +
        STEP('（c）⑥ 均匀分布代入',
          'p_k = \\frac1K \\;\\Rightarrow\\; H = -\\sum_{k=1}^{K}\\frac1K\\log_2\\frac1K = -\\log_2\\frac1K = \\mathbf{\\log_2 K}',
          '', 'H = log₂K') +
        '<div class="note ok"><b>（c）的几个常用值，建议直接背</b><br>' +
        '· K=2（二分类）→ 1 bit<br>' +
        '· K=3 → 1.585 bit<br>' +
        '· K=4 → 2 bit<br>' +
        '· K=15（贷款题按学号拆）→ 3.907 bit<br>' +
        '<b>类别越多，最均匀时的熵越大。</b>这是"信息增益偏爱多取值特征"的根源——' +
        '因为取值多的特征本身就有更大的熵上限。</div>' +
        '<div class="note warn"><b>底数不同要注意</b><br>' +
        '决策树用 ' + MI('\\log_2') + '（单位 bit），交叉熵损失用 ' + MI('\\ln') + '（单位 nat）。<br>' +
        '题目没指定时按这个惯例；指定了就按题目的。</div>');
    root.appendChild(pr9);
  }
});

   自测
   ========================================================= */
function renderTest(){
  var w = el("div");
  w.appendChild(el("h2", null, "自测 · 12 道"));
  w.appendChild(el("p", "sub", "选完立刻判卷并给解释。"));
  var score = el("div", "card");
  var done = {}, right = 0;
  score.innerHTML = '<div class="kv"><span class="k">已答</span><span class="v" id="__done">0 / 12</span></div>' +
    '<div class="kv"><span class="k">正确</span><span class="v" id="__right">0</span></div>' +
    '<div class="pbar"><i id="__bar" style="width:0%"></i></div>';
  w.appendChild(score);

  var QS = [
    { q: "模型把训练损失降到 0，能推出新样本上的损失也是 0 吗？", o: ["能，说明模型完全正确", "不能，训练损失只评价已知样本", "能，只要测试集和训练集同分布"], a: 1,
      e: "训练损失只评价这批已知样本。高容量模型可能记住噪声，或利用只在训练数据中碰巧成立的关系。要判断泛化必须看验证集/测试集。" },
    { q: "用验证集选了训练轮次，然后用测试集报告结果，这个流程", o: ["可以，这是标准做法", "不行，测试集被污染了", "只有小数据集才不行"], a: 0,
      e: "标准流程就是这个：训练集拟合权重 → 验证集选轮次/超参数 → 测试集只报告一次。反过来用测试集选轮次再用它报告，才是错的。" },
    { q: "先把图片做翻转增强，再随机划分训练/测试集，问题是", o: ["没问题", "同一张图的原图与翻转版可能分到两边，造成泄漏", "只会让训练变慢"], a: 1,
      e: "数据泄漏。正确做法是先切分，再只对训练部分做增强。" },
    { q: "两层仿射层串联 W₂(W₁x+b₁)+b₂ 等价于", o: ["一个更复杂的非线性函数", "一层仿射函数 (W₂W₁)x + (W₂b₁+b₂)", "无法化简"], a: 1,
      e: "这是恒等式。没有非线性激活，堆多少层都还在同一类函数里，能力上限就是线性分类器。" },
    { q: "ReLU 在 z = −2 处的导数是", o: ["−2", "1", "0"], a: 2,
      e: "ReLU 负区间输出恒为 0，斜率是 0。所以该位置的梯度传不回去，这就是「神经元死掉」。" },
    { q: "Adam 第二步递推 m₂、v₂ 时，应该用", o: ["修正后的 m̂₁、v̂₁", "原始的 m₁、v₁", "随便哪个都行"], a: 1,
      e: "必须用原始状态。偏差修正得到的 m̂、v̂ 只用于当轮参数更新，不写回状态。这是 Adam 手算最大的坑。" },
    { q: "AdaGrad 与 RMSProp 的主要区别是", o: ["AdaGrad 累计平方和只增不减，RMSProp 用移动平均能回落", "AdaGrad 用动量，RMSProp 不用", "两者完全一样"], a: 0,
      e: "AdaGrad 的 r 单调递增，有效学习率只会变小；RMSProp 用 ρ 加权让旧平方向量衰减，有效学习率能回升。" },
    { q: "ResNet 的 Bottleneck 主支路卷积核尺寸顺序是", o: ["3×3 → 3×3", "1×1 → 3×3 → 1×1", "3×3 → 1×1 → 3×3"], a: 1,
      e: "先 1×1 降通道，再在窄通道上做 3×3，最后 1×1 升通道。BasicBlock 才是 3×3 → 3×3。" },
    { q: "一个 5×5 输入，3×3 核，步长 2，无填充，输出边长是", o: ["2", "3", "1"], a: 0,
      e: "⌊(5+0−3)/2⌋+1 = ⌊1⌋+1 = 2。舍去的那个不完整窗口不参与计算。" },
    { q: "求卷积层对输入的梯度 dX 时，局部导数是", o: ["窗口里的输入值", "卷积核里的权重", "上游梯度"], a: 1,
      e: "求 dX 拿核权重乘梯度，dX 与 X 同形；求 dK 则拿输入值乘梯度，dK 与 K 同形。这两者搞反是最高频失分点。" },
    { q: "one-hot 标签下，交叉熵损失等于", o: ["−log(模型给真实类别的概率)", "熵 H(p) 本身", "KL 散度加熵"], a: 0,
      e: "因为 H(p)=0，KL(p‖q)=H(p,q)−H(p)=H(p,q)，而交叉熵在 one-hot 下只剩 −log q(真类) 一项。" },
    { q: "决策树的增益比为什么要除以划分熵 HA", o: ["为了归一化数值范围", "为了抑制信息增益对「取值多的特征」的偏好", "没有实际意义"], a: 1,
      e: "取值越多，HA 越大、分母越大，把信息增益的偏好压下去。典型反例是按唯一学号拆分，信息增益极高但毫无泛化意义。" }
  ];

  var box = el("div");
  QS.forEach(function(Q, qi){
    var d = el("div", "q");
    d.appendChild(el("div", "qt", (qi + 1) + ". " + Q.q));
    var expl = el("div", "expl", Q.e);
    Q.o.forEach(function(opt, oi){
      var b = el("button", "opt", opt);
      b.addEventListener("click", function(){
        if (done[qi]) return;
        done[qi] = true;
        var ok = (oi === Q.a);
        if (ok) right++;
        // 标出所有选项
        [].forEach.call(d.querySelectorAll(".opt"), function(x, xi){
          if (xi === Q.a){ x.classList.add("right"); x.innerHTML += '<span class="mk">✓</span>'; }
          else if (xi === oi){ x.classList.add("wrong"); x.innerHTML += '<span class="mk">✗</span>'; }
        });
        expl.classList.add("show");
        var n = Object.keys(done).length;
        document.getElementById("__done").textContent = n + " / " + QS.length;
        document.getElementById("__right").textContent = right;
        document.getElementById("__bar").style.width = (n / QS.length * 100) + "%";
        if (n === QS.length){
          toast("答完 " + n + " 题，正确 " + right + " 道");
        }
      });
      d.appendChild(b);
    });
    d.appendChild(expl);
    box.appendChild(d);
  });
  w.appendChild(box);
  VIEW.appendChild(w);
}
