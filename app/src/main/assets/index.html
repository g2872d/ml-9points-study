<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>机器学习 9 考点</title>
<style>
/* ========== 主题变量 ========== */
html[data-theme="light"]{
  --bg:#f5f7fa; --panel:#ffffff; --panel2:#eef2f7; --fg:#141a21; --fg2:#3d4a58;
  --muted:#6b7885; --line:#dfe5ec; --accent:#2563eb; --accent2:#0e9f6e;
  --warn:#d97706; --danger:#dc2626; --grid:#c9d3dd; --shadow:0 1px 3px rgba(16,24,40,.08),0 1px 2px rgba(16,24,40,.04);
  --chip:#e8eef8; --chipfg:#1d4ed8;
}
html[data-theme="dark"]{
  --bg:#0e1318; --panel:#161d24; --panel2:#1d262e; --fg:#e7edf3; --fg2:#c2cdd8;
  --muted:#8fa0b0; --line:#26313b; --accent:#6aa5ff; --accent2:#34d399;
  --warn:#fbbf24; --danger:#f87171; --grid:#33414d; --shadow:0 1px 3px rgba(0,0,0,.5);
  --chip:#1c2b3f; --chipfg:#9ec5ff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--fg);
  font-family:-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  font-size:15px; line-height:1.65;
  -webkit-text-size-adjust:100%;
  padding-bottom:calc(64px + env(safe-area-inset-bottom));
  transition:background .18s,color .18s;
}
/* ========== 顶栏 ========== */
#topbar{
  position:sticky; top:0; z-index:50; display:flex; align-items:center; gap:8px;
  padding:calc(6px + env(safe-area-inset-top)) 12px 6px;
  background:var(--panel); border-bottom:1px solid var(--line);
}
#topbar h1{font-size:15px; margin:0; flex:1; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.iconbtn{
  border:1px solid var(--line); background:var(--panel2); color:var(--fg);
  width:38px; height:38px; border-radius:10px; font-size:17px; cursor:pointer;
  display:flex; align-items:center; justify-content:center; flex:0 0 auto;
}
.iconbtn:active{transform:scale(.94)}
/* ========== 主区 ========== */
main{padding:12px 12px 20px; max-width:760px; margin:0 auto}
h2{font-size:19px; margin:4px 0 2px; line-height:1.35}
.sub{color:var(--muted); font-size:12.5px; margin:0 0 14px}
h3{font-size:15px; margin:20px 0 8px; color:var(--fg); border-left:3px solid var(--accent); padding-left:8px}
h4{font-size:13.5px; margin:14px 0 6px; color:var(--fg2)}
p{margin:8px 0}
small{color:var(--muted); font-size:12px}
code,.mono{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace}
code{background:var(--panel2); padding:1px 5px; border-radius:5px; font-size:12.5px}
/* ========== 卡片 ========== */
.card{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px; margin:12px 0; box-shadow:var(--shadow)}
.grid{display:grid; gap:10px}
@media(min-width:520px){ .grid.two{grid-template-columns:1fr 1fr} }
/* 首页考点卡 */
.tile{
  background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:13px 14px;
  display:flex; gap:12px; align-items:flex-start; cursor:pointer; box-shadow:var(--shadow);
  transition:transform .12s,border-color .12s;
}
.tile:active{transform:scale(.985); border-color:var(--accent)}
.tile .n{
  flex:0 0 auto; width:30px; height:30px; border-radius:9px; background:var(--chip); color:var(--chipfg);
  font-weight:700; font-size:14px; display:flex; align-items:center; justify-content:center;
}
.tile .t{font-weight:600; font-size:14.5px; margin-bottom:2px}
.tile .d{color:var(--muted); font-size:12px; line-height:1.5}
.tile .badge{font-size:10.5px; padding:1px 6px; border-radius:6px; background:var(--warn); color:#fff; margin-left:6px; vertical-align:2px}
/* ========== 控件 ========== */
.row{display:flex; align-items:center; gap:10px; margin:10px 0; flex-wrap:wrap}
.row label{font-size:12.5px; color:var(--muted); flex:0 0 auto; min-width:64px}
input[type=range]{
  -webkit-appearance:none; appearance:none; flex:1; height:34px; background:transparent; min-width:120px;
}
input[type=range]::-webkit-slider-runnable-track{height:5px; background:var(--panel2); border-radius:3px; border:1px solid var(--line)}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none; width:22px; height:22px; border-radius:50%; background:var(--accent);
  margin-top:-9px; border:2px solid var(--panel); box-shadow:0 1px 4px rgba(0,0,0,.3);
}
input[type=range]::-moz-range-track{height:5px; background:var(--panel2); border-radius:3px}
input[type=range]::-moz-range-thumb{width:20px; height:20px; border:2px solid var(--panel); border-radius:50%; background:var(--accent)}
.val{font-family:ui-monospace,Consolas,monospace; font-size:13px; color:var(--accent); min-width:52px; text-align:right; font-weight:600}
.btn{
  border:1px solid var(--line); background:var(--panel2); color:var(--fg);
  padding:9px 14px; border-radius:10px; font-size:13.5px; cursor:pointer; font-weight:500;
  min-height:40px; display:inline-flex; align-items:center; justify-content:center; gap:6px;
}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent); color:#fff; border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px; min-height:32px; font-size:12.5px}
.btn.on{background:var(--accent); color:#fff; border-color:var(--accent)}
.btn:disabled{opacity:.45}
.seg{display:inline-flex; border:1px solid var(--line); border-radius:10px; overflow:hidden; background:var(--panel2)}
.seg button{
  border:0; background:transparent; color:var(--fg2); padding:8px 12px; font-size:12.5px;
  cursor:pointer; min-height:36px; border-right:1px solid var(--line);
}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent); color:#fff; font-weight:600}
/* ========== 表格 ========== */
.tbl{width:100%; border-collapse:collapse; font-size:12.5px; margin:8px 0}
.tbl th,.tbl td{border:1px solid var(--line); padding:6px 7px; text-align:right}
.tbl th{background:var(--panel2); font-weight:600; color:var(--fg2); text-align:center}
.tbl td:first-child,.tbl th:first-child{text-align:left}
.tbl tr.hi td{background:var(--chip); font-weight:600}
.tbl td.num{font-family:ui-monospace,Consolas,monospace}
/* ========== 公式块 ========== */
.formula{
  background:var(--panel2); border-radius:10px; padding:11px 13px; margin:9px 0;
  font-family:ui-monospace,Consolas,"DejaVu Sans Mono",monospace; font-size:13px;
  line-height:1.9; overflow-x:auto; white-space:pre-wrap; word-break:break-word; color:var(--fg);
}
/* ========== 提示条 ========== */
.note{
  border-left:3px solid var(--accent); background:var(--panel2); border-radius:0 9px 9px 0;
  padding:9px 12px; margin:10px 0; font-size:13px; color:var(--fg2);
}
.note.warn{border-left-color:var(--warn)}
.note.danger{border-left-color:var(--danger)}
.note.ok{border-left-color:var(--accent2)}
.note b{color:var(--fg)}
/* ========== canvas ========== */
canvas{display:block; width:100%; border-radius:10px; background:var(--panel2); touch-action:pan-y}
/* ========== 矩阵 ========== */
.mat{display:inline-grid; gap:3px; vertical-align:middle}
.mat span{
  min-width:38px; height:34px; display:flex; align-items:center; justify-content:center;
  background:var(--panel2); border:1px solid var(--line); border-radius:6px;
  font-family:ui-monospace,Consolas,monospace; font-size:12.5px; transition:all .22s;
}
.mat span.act{background:var(--accent); color:#fff; border-color:var(--accent); font-weight:700; transform:scale(1.06)}
.mat span.out{background:var(--accent2); color:#fff; border-color:var(--accent2); font-weight:700}
.mat span.zero{color:var(--muted)}
.matwrap{display:flex; gap:12px; align-items:center; flex-wrap:wrap; justify-content:center; margin:10px 0}
.matlabel{font-size:11px; color:var(--muted); text-align:center; margin-top:4px}
/* ========== 底栏 ========== */
#tabbar{
  position:fixed; left:0; right:0; bottom:0; z-index:50; display:flex;
  background:var(--panel); border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
#tabbar button{
  flex:1; border:0; background:transparent; color:var(--muted); padding:9px 4px 8px;
  font-size:10.5px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:2px;
}
#tabbar button .ic{font-size:17px; line-height:1}
#tabbar button.on{color:var(--accent); font-weight:600}
/* ========== 进度条 ========== */
.pbar{height:5px; background:var(--panel2); border-radius:3px; overflow:hidden; margin:6px 0}
.pbar>i{display:block; height:100%; background:var(--accent); border-radius:3px; transition:width .25s}
/* ========== 单选题 ========== */
.q{margin:14px 0; padding-bottom:12px; border-bottom:1px dashed var(--line)}
.q:last-child{border-bottom:0}
.q .qt{font-size:13.5px; font-weight:600; margin-bottom:8px}
.opt{
  display:block; width:100%; text-align:left; border:1px solid var(--line); background:var(--panel2);
  color:var(--fg); padding:10px 12px; border-radius:9px; margin:6px 0; font-size:13px; cursor:pointer;
  line-height:1.5;
}
.opt:active{transform:scale(.99)}
.opt.right{border-color:var(--accent2); background:color-mix(in srgb,var(--accent2) 16%,var(--panel)); font-weight:600}
.opt.wrong{border-color:var(--danger); background:color-mix(in srgb,var(--danger) 16%,var(--panel))}
.opt .mk{float:right; font-weight:700}
.expl{font-size:12.5px; color:var(--fg2); background:var(--panel2); border-radius:8px; padding:9px 11px; margin-top:7px; display:none}
.expl.show{display:block}
.hidden{display:none !important}
.kv{display:flex; justify-content:space-between; gap:8px; padding:4px 0; font-size:13px; border-bottom:1px dotted var(--line)}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--muted)}
.kv .v{font-family:ui-monospace,Consolas,monospace; font-weight:600; color:var(--accent)}
.tag{display:inline-block; font-size:11px; padding:1px 7px; border-radius:6px; background:var(--chip); color:var(--chipfg); margin-right:5px}
/* ========== 解释块（讲原理用） ========== */
.explain{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px; margin:12px 0; box-shadow:var(--shadow)}
.explain h4{margin:0 0 10px; font-size:14.5px; color:var(--accent); display:flex; align-items:center; gap:7px;
  border-left:0; padding-left:0}
.explain h4::before{content:"?"; flex:0 0 auto; width:19px; height:19px; border-radius:50%;
  background:var(--accent); color:#fff; font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center}
.explain p{margin:9px 0; font-size:13.5px; line-height:1.7}
.explain p:first-of-type{margin-top:0}
.why{background:var(--panel2); border-radius:10px; padding:11px 13px; margin:9px 0; font-size:13px; line-height:1.7;
  border-left:3px solid var(--accent2)}
.why b{color:var(--fg)}
.why .lbl{color:var(--accent2); font-weight:700; font-size:12px; display:block; margin-bottom:3px}
.analogy{background:color-mix(in srgb, var(--warn) 12%, var(--panel)); border-left:3px solid var(--warn);
  border-radius:0 10px 10px 0; padding:11px 13px; margin:9px 0; font-size:13px; line-height:1.7}
.analogy .lbl{color:var(--warn); font-weight:700; font-size:12px; display:block; margin-bottom:3px}
.steps{margin:10px 0}
.steps .st{display:flex; gap:10px; margin:11px 0; align-items:flex-start}
.steps .st .n{flex:0 0 auto; width:21px; height:21px; border-radius:50%; background:var(--accent); color:#fff;
  font-size:11.5px; font-weight:700; display:flex; align-items:center; justify-content:center; margin-top:3px}
.steps .st .c{flex:1; font-size:13px; line-height:1.7}
.steps .st .c b{color:var(--fg)}
.term{color:var(--accent); font-weight:600}
.deriv{background:var(--panel2); border-radius:10px; padding:11px 13px; margin:9px 0;
  font-family:ui-monospace,Consolas,monospace; font-size:12.5px; line-height:2.1; overflow-x:auto;
  white-space:pre-wrap; word-break:break-word; color:var(--fg)}
.deriv .cm{color:var(--muted); font-style:normal}
</style>
</head>
<body>

<header id="topbar">
  <button class="iconbtn" id="btnBack" title="返回">‹</button>
  <h1 id="crumb">机器学习 9 考点</h1>
  <button class="iconbtn" id="btnTheme" title="切换主题">◐</button>
</header>

<main id="view"></main>

<nav id="tabbar">
  <button data-tab="home" class="on"><span class="ic">▦</span>考点</button>
  <button data-tab="test"><span class="ic">✓</span>自测</button>
  <button data-tab="cheat"><span class="ic">⚡</span>速查</button>
  <button data-tab="about"><span class="ic">ⓘ</span>关于</button>
</nav>

<script>
"use strict";
/* =========================================================
   0. 主题
   ========================================================= */
var THEME_KEY = "ml9.theme";
function systemDark(){ return window.matchMedia && matchMedia("(prefers-color-scheme:dark)").matches; }
function resolveTheme(){
  var t = localStorage.getItem(THEME_KEY) || "auto";
  if (t === "auto") return systemDark() ? "dark" : "light";
  return t;
}
function cssVar(name){
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}
function applyTheme(){
  var t = resolveTheme();
  document.documentElement.setAttribute("data-theme", t);
  var bg = cssVar("--bg");
  // 同步原生状态栏；light=深色图标
  try{
    if (window.AndroidHost && AndroidHost.applyChrome){
      AndroidHost.applyChrome(bg, t === "light");
    }
  }catch(e){}
  redrawAll();
}
function cycleTheme(){
  var cur = localStorage.getItem(THEME_KEY) || "auto";
  var next = cur === "auto" ? "light" : (cur === "light" ? "dark" : "auto");
  localStorage.setItem(THEME_KEY, next);
  applyTheme();
  toast(next === "auto" ? "主题：跟随系统" : (next === "light" ? "主题：浅色" : "主题：深色"));
}

/* =========================================================
   1. 工具
   ========================================================= */
function el(tag, cls, html){
  var d = document.createElement(tag);
  if (cls) d.className = cls;
  if (html != null) d.innerHTML = html;
  return d;
}
function fmt(x, n){ n = (n === undefined) ? 3 : n; return (Math.abs(x) < 1e-12 ? 0 : x).toFixed(n); }
function toast(msg){
  var t = document.getElementById("__toast");
  if (!t){
    t = el("div", ""); t.id = "__toast";
    t.style.cssText = "position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));"+
      "background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:20px;font-size:13px;z-index:999;"+
      "opacity:0;transition:opacity .22s;pointer-events:none;max-width:80%;text-align:center";
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = "1";
  clearTimeout(t._tm);
  t._tm = setTimeout(function(){ t.style.opacity = "0"; }, 1500);
}
/* canvas 高清绘制 + 主题切换自动重绘 */
var CANVASES = [];
function mkCanvas(h){
  var c = document.createElement("canvas");
  c.style.height = h + "px";
  CANVASES.push(c);
  return c;
}
function draw(c, fn){
  c._fn = fn;
  paint(c);
}
function paint(c){
  if (!c.isConnected || !c._fn) return;
  var dpr = window.devicePixelRatio || 1;
  var w = c.clientWidth || 300, h = c.clientHeight || 150;
  c.width = Math.round(w * dpr); c.height = Math.round(h * dpr);
  var ctx = c.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  c._fn(ctx, w, h);
}
function redrawAll(){
  for (var i = 0; i < CANVASES.length; i++) paint(CANVASES[i]);
}
window.addEventListener("resize", function(){ setTimeout(redrawAll, 60); });
if (window.matchMedia){
  try{
    matchMedia("(prefers-color-scheme:dark)").addEventListener("change", function(){
      if ((localStorage.getItem(THEME_KEY) || "auto") === "auto") applyTheme();
    });
  }catch(e){}
}

/* 画坐标系 */
function axes(ctx, w, h, pad, xmin, xmax, ymin, ymax){
  var X = function(v){ return pad.l + (v - xmin) / (xmax - xmin) * (w - pad.l - pad.r); };
  var Y = function(v){ return h - pad.b - (v - ymin) / (ymax - ymin) * (h - pad.t - pad.b); };
  ctx.strokeStyle = cssVar("--grid"); ctx.lineWidth = 1;
  ctx.beginPath();
  if (ymin <= 0 && ymax >= 0){ ctx.moveTo(X(xmin), Y(0)); ctx.lineTo(X(xmax), Y(0)); }
  if (xmin <= 0 && xmax >= 0){ ctx.moveTo(X(0), Y(ymin)); ctx.lineTo(X(0), Y(ymax)); }
  ctx.stroke();
  return { X: X, Y: Y };
}

/* 从 CSS 变量取色 */
function col(n){ return cssVar("--" + n); }

/* =========================================================
   2. 路由
   ========================================================= */
var VIEW = document.getElementById("view");
var CRUMB = document.getElementById("crumb");
var BACK = document.getElementById("btnBack");
var CURRENT = "home";
var SECTIONS = [];

function go(route){
  CANVASES.length = 0;
  VIEW.innerHTML = "";
  CURRENT = route;
  window.scrollTo(0, 0);
  if (route === "home"){ renderHome(); setTab("home"); BACK.style.visibility = "hidden"; CRUMB.textContent = "机器学习 9 考点"; }
  else if (route === "test"){ renderTest(); setTab("test"); BACK.style.visibility = "hidden"; CRUMB.textContent = "自测"; }
  else if (route === "cheat"){ renderCheat(); setTab("cheat"); BACK.style.visibility = "hidden"; CRUMB.textContent = "速查"; }
  else if (route === "about"){ renderAbout(); setTab("about"); BACK.style.visibility = "hidden"; CRUMB.textContent = "关于"; }
  else {
    var s = null;
    for (var i = 0; i < SECTIONS.length; i++) if (SECTIONS[i].id === route) s = SECTIONS[i];
    if (!s){ renderHome(); return; }
    setTab("");
    BACK.style.visibility = "visible";
    CRUMB.textContent = "考点 " + s.no;
    s.render(VIEW);
  }
  setTimeout(redrawAll, 30);
}
function setTab(t){
  var bs = document.querySelectorAll("#tabbar button");
  for (var i = 0; i < bs.length; i++) bs[i].classList.toggle("on", bs[i].getAttribute("data-tab") === t);
}
BACK.addEventListener("click", function(){ go("home"); });
document.getElementById("btnTheme").addEventListener("click", cycleTheme);
(function(){
  var bs = document.querySelectorAll("#tabbar button");
  for (var i = 0; i < bs.length; i++){
    bs[i].addEventListener("click", function(){ go(this.getAttribute("data-tab")); });
  }
})();

/* =========================================================
   3. 首页
   ========================================================= */
function renderHome(){
  var wrap = el("div");
  wrap.appendChild(el("h2", null, "机器学习 · 9 个考点"));
  wrap.appendChild(el("p", "sub", "每个考点都能动手玩。算例与课堂课件一致，数字都核过。"));
  var g = el("div", "grid");
  for (var i = 0; i < SECTIONS.length; i++){
    (function(s){
      var t = el("div", "tile");
      t.innerHTML = '<div class="n">' + s.no + '</div><div style="flex:1"><div class="t">' + s.title +
        (s.hot ? '<span class="badge">必考计算</span>' : '') + '</div><div class="d">' + s.desc + '</div></div>';
      t.addEventListener("click", function(){ go(s.id); });
      g.appendChild(t);
    })(SECTIONS[i]);
  }
  wrap.appendChild(g);
  wrap.appendChild(el("p", "sub", "提示：右上角 ◐ 切换 跟随系统 / 浅色 / 深色。"));
  VIEW.appendChild(wrap);
}

/* =========================================================
   考点 1 机器学习 ≠ 优化
   ========================================================= */
SECTIONS.push({
  id: "p1", no: "01", title: "机器学习为什么不等于优化",
  desc: "训练损失最低的那个模型，为什么常常不能选",
  render: function(root){
    root.appendChild(el("h2", null, "01 · 机器学习为什么不等于优化"));
    root.appendChild(el("p", "sub", "拖动滑块改变训练轮次，看两条曲线怎么分家。"));

    var ex = el("div", "explain");
    ex.innerHTML =
      '<h4>先搞清楚「学习」到底指什么</h4>' +
      '<p>你手上有过去几年的房价成交记录：面积、位置是输入，成交价是答案。你想要的是<b>一套还没卖过的房子值多少钱</b>。</p>' +
      '<p>注意这句话的关键：你要预测的是<b>没见过的样本</b>，不是把已经知道的答案再背一遍。</p>' +
      '<div class="analogy"><span class="lbl">打个比方</span>' +
      '学生做题。老师给了 100 道练习题的答案（训练集）。<br>' +
      '如果他只是把 100 道题的答案背下来，练习册上能考满分，但换一张卷子就完蛋。<br>' +
      '如果他学会了「这类题该怎么想」，换卷子也能做——这叫<b>举一反三</b>，学术上叫<span class="term">泛化</span>。<br>' +
      '机器学习要的是后者。</div>' +
      '<p><b>所以「优化」为什么不够？</b></p>' +
      '<p>优化是一门纯数学：给定一个函数，把它压到最小。它只回答一个问题——<b>怎样把这个已经写死的目标函数降下去</b>。</p>' +
      '<p>但训练时你能算的只有「这 100 道练习题上的平均错误」，你真正想要的是「新卷子上的错误」。这两件事<b>不是一回事</b>。' +
      '把练习题错误压到 0，可能只是把答案背下来了。这个差距就是泛化问题，它在优化的管辖范围之外。</p>' +
      '<div class="why"><span class="lbl">一句话记住</span>' +
      '<b>机器学习 = 优化 + 泛化。</b>优化负责把训练损失降下去，泛化负责让降下去的那个东西在新数据上也成立。' +
      '只做前者，就是过拟合。</div>';
    root.appendChild(ex);

    /* --- 曲线 --- */
    var card = el("div", "card");
    var capSeg = el("div", "seg");
    var CAPS = [["小容量", 0], ["中容量", 1], ["大容量", 2]];
    CAPS.forEach(function(c, i){
      var b = el("button", i === 1 ? "on" : null, c[0]);
      b.addEventListener("click", function(){
        cap = c[1];
        [].forEach.call(capSeg.children, function(x){ x.classList.remove("on"); });
        b.classList.add("on"); refresh();
      });
      capSeg.appendChild(b);
    });
    card.appendChild(el("div", "row")).appendChild(capSeg);
    var cvs = mkCanvas(180); card.appendChild(cvs);
    var info = el("div"); card.appendChild(info);
    var rw = el("div", "row"), rl = el("label", null, "训练轮次"), rg = el("input"), rv = el("span", "val");
    rg.type = "range"; rg.min = 0; rg.max = 40; rg.value = 12; rg.step = 1;
    rw.appendChild(rl); rw.appendChild(rg); rw.appendChild(rv); card.appendChild(rw);
    root.appendChild(card);

    var cap = 1, epoch = 12;
    function curves(c, k){
      // 训练损失：容量越大降得越快越低
      var tau = [7, 4.5, 2.6][c];
      var base = [0.95, 0.72, 0.42][c];
      var tr = base * Math.exp(-k / tau) + 0.012;
      // 验证损失：先跟着降，容量越大越早抬头
      var up = [0.00012, 0.00075, 0.0026][c];
      var va = [0.98, 0.80, 0.58][c] * Math.exp(-k / (tau * 1.25)) + 0.06 + up * k * k;
      return [tr, va];
    }
    function bestEpoch(c){
      var best = 1e9, bi = 0;
      for (var k = 0; k <= 40; k++){ var v = curves(c, k)[1]; if (v < best){ best = v; bi = k; } }
      return bi;
    }
    function refresh(){
      rv.textContent = epoch;
      var be = bestEpoch(cap);
      draw(cvs, function(ctx, w, h){
        var pts = [], i;
        for (i = 0; i <= 40; i++) pts.push(curves(cap, i));
        var ymax = 0.02;
        for (i = 0; i < pts.length; i++) ymax = Math.max(ymax, pts[i][0], pts[i][1]);
        ymax = Math.ceil(ymax * 10) / 10 + 0.05;
        var ax = axes(ctx, w, h, { l: 34, r: 10, t: 12, b: 24 }, 0, 40, 0, ymax);
        // 网格标
        ctx.fillStyle = col("muted"); ctx.font = "10px ui-monospace,monospace"; ctx.textAlign = "right";
        for (var t = 0; t <= 4; t++){
          var yv = ymax * t / 4;
          ctx.fillText(yv.toFixed(2), 30, ax.Y(yv) + 3);
          ctx.strokeStyle = col("line"); ctx.beginPath(); ctx.moveTo(34, ax.Y(yv)); ctx.lineTo(w - 10, ax.Y(yv)); ctx.stroke();
        }
        ctx.textAlign = "center";
        for (var e = 0; e <= 40; e += 10) ctx.fillText(e, ax.X(e), h - 8);
        // 最佳轮次虚线
        ctx.strokeStyle = col("accent2"); ctx.setLineDash([4, 4]); ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(ax.X(be), 12); ctx.lineTo(ax.X(be), h - 24); ctx.stroke(); ctx.setLineDash([]);
        ctx.fillStyle = col("accent2"); ctx.textAlign = "left";
        ctx.fillText("验证最低 @" + be, Math.min(ax.X(be) + 4, w - 78), 22);
        // 两条线
        function line(idx, color){
          ctx.strokeStyle = color; ctx.lineWidth = 2.2; ctx.beginPath();
          for (var k = 0; k <= 40; k++){
            var p = curves(cap, k)[idx];
            if (k === 0) ctx.moveTo(ax.X(k), ax.Y(p)); else ctx.lineTo(ax.X(k), ax.Y(p));
          }
          ctx.stroke();
        }
        line(0, col("accent")); line(1, col("warn"));
        // 当前点
        var cp = curves(cap, epoch);
        ctx.fillStyle = col("accent"); ctx.beginPath(); ctx.arc(ax.X(epoch), ax.Y(cp[0]), 4, 0, 7); ctx.fill();
        ctx.fillStyle = col("warn"); ctx.beginPath(); ctx.arc(ax.X(epoch), ax.Y(cp[1]), 4, 0, 7); ctx.fill();
        // 图例
        ctx.fillStyle = col("accent"); ctx.fillRect(w - 96, 10, 10, 3);
        ctx.fillStyle = col("fg2"); ctx.textAlign = "left"; ctx.font = "11px sans-serif";
        ctx.fillText("训练", w - 82, 15);
        ctx.fillStyle = col("warn"); ctx.fillRect(w - 96, 24, 10, 3);
        ctx.fillStyle = col("fg2"); ctx.fillText("验证", w - 82, 29);
      });
      var tr = curves(cap, epoch)[0], va = curves(cap, epoch)[1];
      info.innerHTML =
        '<div class="kv"><span class="k">第 ' + epoch + ' 轮 训练损失</span><span class="v">' + fmt(tr) + '</span></div>' +
        '<div class="kv"><span class="k">第 ' + epoch + ' 轮 验证损失</span><span class="v">' + fmt(va) + '</span></div>' +
        '<div class="kv"><span class="k">两者差距（泛化间隙）</span><span class="v">' + fmt(va - tr) + '</span></div>' +
        (epoch > be
          ? '<div class="note warn">已经越过验证最低点（第 ' + be + ' 轮）。训练损失还在降，但验证在升——这就是过拟合开始的地方。<b>该保留的是第 ' + be + ' 轮，不是第 ' + epoch + ' 轮。</b></div>'
          : (epoch === be
            ? '<div class="note ok">正好踩在验证最低点上，这一轮的权重该被留下来。</div>'
            : '<div class="note">还没到验证最低点，继续训练通常还有收益。</div>'));
    }
    rg.addEventListener("input", function(){ epoch = +rg.value; refresh(); });
    refresh();

    /* --- 三要素 --- */
    root.appendChild(el("h3", null, "机器学习三要素：三个词要能分开说"));
    var c2 = el("div", "card");
    c2.innerHTML =
      '<table class="tbl"><tr><th>要素</th><th style="text-align:left">回答什么问题</th><th style="text-align:left">房价例子</th></tr>' +
      '<tr><td>模型</td><td style="text-align:left">用什么样的函数预测</td><td style="text-align:left">ŷ = wx + b，或更复杂的曲线</td></tr>' +
      '<tr><td>学习准则</td><td style="text-align:left">怎样比较两个候选模型</td><td style="text-align:left">平均平方损失，可再加正则项</td></tr>' +
      '<tr><td>优化算法</td><td style="text-align:left">参数怎么找出来</td><td style="text-align:left">梯度下降反复更新 w、b</td></tr></table>' +
      '<div class="note"><b>区分口诀：</b>换优化算法（SGD→Adam）→ 能表达的规律没变；换模型（直线→曲线）→ 能力上限变了；' +
      '换学习准则（平方损失→交叉熵）→ 打分规则变了。</div>' +
      '<div class="note danger">判断题常挖坑：「用了 Adam 所以模型更强了」——错。Adam 只影响能不能更快更好地找到同一族函数里的参数。</div>';
    root.appendChild(c2);

    /* --- 两种风险 --- */
    root.appendChild(el("h3", null, "经验风险 vs 期望风险"));
    var ex1b = el("div", "explain");
    ex1b.innerHTML =
      '<h4>这两个公式长得几乎一样，差在哪一个字</h4>' +
      '<div class="deriv">经验风险  R_emp(θ) = (1/N) · Σᵢ ℓ(f_θ(xᵢ), yᵢ)\n' +
      '期望风险  R(θ)     = E_{(x,y)~P}[ ℓ(f_θ(x), y) ]</div>' +
      '<p>左边，两者都在算「预测有多错」（ℓ 就是损失）。真正的区别在<b>「对谁取平均」</b>：</p>' +
      '<div class="steps">' +
      '<div class="st"><div class="n">1</div><div class="c"><b>经验风险对「手上的 N 条样本」取平均。</b><br>' +
      '式子里的 (1/N)·Σ 就是「把这 N 条加起来除以 N」——<b>这是能真的算出来的数</b>，因为数据就在你手上。</div></div>' +
      '<div class="st"><div class="n">2</div><div class="c"><b>期望风险对「真实数据分布 P」取平均。</b><br>' +
      'E 的意思是「把所有可能出现的样本，按它们出现的概率加权平均」。<br>' +
      '<b>但 P 你不知道</b>——你不可能知道「未来全世界的房子长什么样、各占多少比例」。所以这个数是<b>算不出来的</b>，只能估。</div></div>' +
      '</div>' +
      '<div class="why"><span class="lbl">θ 出现在这两个式子里，说明什么</span>' +
      'θ 是模型参数。两个式子都是 θ 的函数——<b>参数一变，两个风险都跟着变，但它们不是同一条曲线</b>。' +
      '优化只在降低左边那条（经验风险），完全不管右边那条会怎么走。<br>' +
      '训练损失降到 0，只意味着「左边到底了」，右边可能反而更高。这就是泛化间隙。</div>' +
      '<div class="analogy"><span class="lbl">一句话区分</span>' +
      '<b>经验风险 = 做过的题的错率；期望风险 = 未来所有考试的错率。</b><br>' +
      '前者能算，后者只能猜。学习的目标永远是后者，但你能优化的只有前者——这个矛盾就是机器学习全部困难的根源。</div>' +
      '<div class="note">例：三条训练样本损失 1、3、2，经验风险 = (1+3+2)/3 = <b>2</b>。' +
      '但这个「2」不能告诉你未来房子的平均误差，因为未来房屋的分布不一样。</div>';
    root.appendChild(ex1b);
    var c3 = el("div", "card");
    c3.innerHTML =
      '<div class="formula">经验风险  R<sub>emp</sub>(θ) = (1/N) · Σ<sub>i</sub> ℓ(f<sub>θ</sub>(x<sub>i</sub>), y<sub>i</sub>)</div>' +
      '<div class="formula">期望风险  R(θ) = E<sub>(x,y)~P</sub>[ ℓ(f<sub>θ</sub>(x), y) ]</div>' +
      '<p>前者是<b>能算出来的</b>（训练集上 N 个损失取平均）；后者是<b>真实分布上的平均</b>，P 你不知道，只能估。</p>' +
      '<div class="note">例：三条训练样本损失 1、3、2 → 经验风险 = (1+3+2)/3 = <b>2</b>。『2』这个数不能告诉你未来房子的平均误差。</div>';
    root.appendChild(c3);

    root.appendChild(el("h3", null, "加正则项：把「简单」写进目标函数"));
    var c4 = el("div", "card");
    c4.innerHTML =
      '<div class="formula">训练时最小化： R<sub>emp</sub>(θ) + λ·Ω(θ)　　例如 Ω(θ)=‖θ‖²</div>' +
      '<div class="note warn"><b>重要区分：</b>降低这个训练目标是<b>优化</b>动作；它到底有没有改善新样本的表现，<b>要看验证集</b>，不能想当然。</div>';
    root.appendChild(c4);
  }
});

    root.appendChild(ex);

      var key = i + "," + j;

      else if (out[key]) s.className = "out";

    }

    root.appendChild(el("h3", null, "老师视频里那段推导（PDF 漏掉的部分）"));

    var ex8b = el("div", "explain");
    ex8b.innerHTML =
      '<h4>交叉熵公式 H(p,q) = −Σ p log q，每个字母是谁</h4>' +

      '拆开读：\n' +

      '相对熵  KL(p‖q)= Σ p(x) log[p(x)/q(x)]\n' +

      '<div class="note"><b>通俗版：</b>把分布想成一套密码本。熵 = 用最优编码编真实分布，平均花多少字；交叉熵 = 拿按 q 设计的密码本去编 p，平均多花多少字。' +

    root.appendChild(c2);

    root.appendChild(el("h3", null, "模拟卷第 8 题原题"));
    var c3 = el("div", "card");
    c3.innerHTML = '<p>三类分数 (0, ln3, ln2)，真类为第 3 类。另一条样本真类概率 3/4，求两条平均交叉熵。</p>' +
      '<div class="formula">指数 = (1, 3, 2)，和 = 6 → q = (1/6, 1/2, 1/3)\n' +
      'ℓ₁ = −ln(1/3) = ln3 ≈ 1.099\n' +
      '梯度 q − p = (1/6, 1/2, −2/3)　和 = 1/6+3/6−4/6 = 0 ✓\n' +
      'ℓ₂ = −ln(3/4) = ln(4/3)\n' +
      '平均 = [ln3 + ln(4/3)]/2 = ln4/2 = <b>ln2 ≈ 0.693</b></div>' +
      '<div class="note ok"><b>这道题的精妙处：</b>相加后对数合并成 ln4，除以 2 正好是 ln2。算完发现答案很整齐，说明走对了。</div>' +
      '<div class="note">二分类：ℓ = −[y·ln q + (1−y)·ln(1−q)]。y=0 时要用<b>负类概率 1−q</b>，不是 q。' +
      '例：q=0.9，y=1 → −ln0.9≈0.105；y=0 → −ln0.1≈2.303。</div>';
    root.appendChild(c3);
  }
});

  render: function(root){

    ex.innerHTML =
      '<h4>信息量 −log p 是怎么来的？不能随便定个公式吗</h4>' +
      '<p>能推出来一点，不用硬背。我们希望「信息量」这个东西满足三条常识：</p>' +
      '<div class="steps">' +
      '<div class="st"><div class="n">1</div><div class="c"><b>必然发生的事，信息量为 0。</b>「太阳明天会升起」这句话没有任何信息。' +
      '所以 p=1 时，信息量应该是 0。</div></div>' +
      '<div class="st"><div class="n">2</div><div class="c"><b>越罕见的事，信息量越大。</b>「明天下雪」比「明天晴天」信息量大。</div></div>' +
      '<div class="st"><div class="n">3</div><div class="c"><b>两件独立的事同时发生，信息量应该相加。</b>' +

      '</div>' +

      '<p>信息量说的是「某一个结果」有多意外。但抽之前我们面对的是<b>一整个分布</b>。' +
      '熵 = 把每种结果的信息量，<b>按它出现的概率加权平均</b>：</p>' +
      '<div class="deriv">H(p) = − Σ pₖ · log pₖ\n\n' +
      '拆开读：\n' +
      '  pₖ        这个结果出现的概率（当权重用）\n' +

      '       = 「抽之前，平均有多不确定」</div>' +
      '<p>所以熵的含义是：<b>抽之前，平均有多不确定。</b>或者说「平均每次要接收多少信息量才能确定结果」。</p>' +

      '熵还等于「用最优编码方案编这个分布，平均每条消息要多少位」——两种说法是同一件事。</div>';
    var rw = el("div", "row"), rg = el("input"), rv = el("span", "val");
    rw.appendChild(el("label", null, "正类占比 p")); rg.type = "range"; rg.min = 0.01; rg.max = 0.99; rg.step = 0.01; rg.value = 0.5;
    rw.appendChild(rg); rw.appendChild(rv); c1.appendChild(rw);
    var cvs1 = mkCanvas(180); c1.appendChild(cvs1);
    var out1 = el("div"); c1.appendChild(out1);
    function H2(p){ if (p <= 0 || p >= 1) return 0; return -(p * Math.log2(p) + (1 - p) * Math.log2(1 - p)); }
    function refresh1(){
      var p = +rg.value; rv.textContent = p.toFixed(2);
      draw(cvs1, function(ctx, w, h){

    /* --- 四种熵 --- */
    root.appendChild(el("h3", null, "② 决策树要算的四个量（别混）"));
    var ex9b = el("div", "explain");
    ex9b.innerHTML =
      '<h4>四个公式，逐个符号拆开看它到底在算谁</h4>' +
      '<p><b>① 条件熵 H(D|A) = Σ (|Dᵥ|/|D|) · H(Dᵥ)</b></p>' +
      '<div class="deriv">H(D|A) = Σ (|Dᵥ| / |D|) · H(Dᵥ)\n\n' +
      '拆开读：\n' +
      '  Σ            把各组的贡献加起来\n' +
      '  |Dᵥ| / |D|   这一组样本数 ÷ 总样本数 = 这组占多大比例（权重）\n' +
      '  H(Dᵥ)        这一组内部的乱度\n\n' +

      '减少得多 → 这个问题问得好 → 值得拿它来分</div>' +
      '<p><b>③ 划分熵 HA(D) = −Σ (|Dᵥ|/|D|) log₂(|Dᵥ|/|D|)</b></p>' +

    root.appendChild(ex9b);
    var c2 = el("div", "card");

      '<tr><td>父节点熵 H(D)</td><td style="text-align:left">父节点内各类别占比</td><td style="text-align:left">分组前有多混杂</td></tr>' +
      '<tr><td>子节点熵 H(Dᵥ)</td><td style="text-align:left">组内各类别占比</td><td style="text-align:left">组内有多混杂</td></tr>' +
      '<tr><td>条件熵 H(D|A)</td><td style="text-align:left">组占比加权子节点熵</td><td style="text-align:left">分组后的平均不确定性</td></tr>' +
      '<tr><td>划分熵 HA(D)</td><td style="text-align:left">只拿组大小/父节点数</td><td style="text-align:left">分到哪支有多不确定</td></tr></table>' +
      '<div class="formula">H(D|A) = Σᵥ (|Dᵥ|/|D|)·H(Dᵥ)\n' +
      'g(D,A) = H(D) − H(D|A)\n' +
      'HA(D)  = −Σᵥ (|Dᵥ|/|D|)·log₂(|Dᵥ|/|D|)\n' +
      'gR     = g / HA</div>' +
      '<div class="note danger"><b>最容易混的一点：</b>条件熵的加权权重是组占比，但求的是 <b>H(Dᵥ)——组内标签熵</b>；' +
      '划分熵的加权权重也是组占比，但求的是 <b>log₂(组占比)——只看组大小，完全不看标签</b>。</div>' +

      '增益比用划分熵做分母把这种偏好压下去。</div>' +
      '<div class="note">若划分只有一个分支，HA=0，除零 → 跳过该候选。原版 C4.5 是先在信息增益不低于平均值的候选里挑，再比较增益比。题面明确规定时按题设。</div>';
    root.appendChild(c2);

    /* --- 15 人贷款题 --- */
    root.appendChild(el("h3", null, "③ 15 人贷款题：完整复算"));
    var c3 = el("div", "card");
    var FEATS = [
      { name: "年龄", groups: [[2,3],[3,2],[4,1]], labels: ["青年","中年","老年"] },
      { name: "工作", groups: [[5,0],[4,6]], labels: ["有","无"] },
      { name: "房产", groups: [[6,0],[3,6]], labels: ["有","无"] },
      { name: "信贷", groups: [[1,4],[4,2],[4,0]], labels: ["一般","好","很好"] }
    ];
    var HD = H2(9 / 15);
    function Hgrp(ok, no){ var n = ok + no; if (!n) return 0; var p = ok / n; return H2(p); }
    var tbl = el("table", "tbl"); c3.appendChild(tbl);
    var tbody = el("tbody"); tbl.appendChild(tbody);
    var detail = el("div"); c3.appendChild(detail);
    var rows = [];
    FEATS.forEach(function(F){

      F.groups.forEach(function(g){ var n = g[0] + g[1]; tot += n; sizes.push(n); });
      F.groups.forEach(function(g, i){
        var n = sizes[i];
        cond += (n / tot) * Hgrp(g[0], g[1]);
      });
      var gain = HD - cond;
      var ha = 0;
      sizes.forEach(function(n){ var p = n / tot; if (p > 0) ha -= p * Math.log2(p); });
      rows.push({ name: F.name, cond: cond, gain: gain, ha: ha, gr: ha > 0 ? gain / ha : 0, sizes: sizes, groups: F.groups, labels: F.labels });
    });
    var html = '<tr><th>特征</th><th>分支计数(批准,拒绝)</th><th>条件熵</th><th>信息增益</th><th>增益比</th></tr>';
    rows.forEach(function(r, i){
      html += '<tr data-i="' + i + '"><td>' + r.name + '</td><td class="num" style="font-size:11px">' +
        r.groups.map(function(g, k){ return r.labels[k] + "(" + g[0] + "," + g[1] + ")"; }).join("，") +
        '</td><td class="num">' + fmt(r.cond) + '</td><td class="num">' + fmt(r.gain) + '</td><td class="num">' + fmt(r.gr) + '</td></tr>';
    });
    tbody.innerHTML = html;
    // 点击行看逐步计算
    var trs = tbody.querySelectorAll("tr[data-i]");
    for (var ti = 0; ti < trs.length; ti++){
      (function(tr){
        tr.style.cursor = "pointer";
        tr.addEventListener("click", function(){
          var r = rows[+tr.getAttribute("data-i")];
          var steps = r.groups.map(function(g, k){
            var n = g[0] + g[1];
            return "  " + r.labels[k] + "组 (" + g[0] + "批准," + g[1] + "拒绝)，共 " + n + " 人：H = " + fmt(Hgrp(g[0], g[1]));
          }).join("\n");
          var terms = r.groups.map(function(g, k){ return "(" + r.sizes[k] + "/15)×" + fmt(Hgrp(g[0], g[1])); }).join(" + ");
          detail.innerHTML = '<div class="note"><b>父节点熵：</b>H(D) = −(9/15)log₂(9/15) − (6/15)log₂(6/15) = <b>' + fmt(HD) + '</b></div>' +
            '<div class="formula">' + steps + '\n\n条件熵 H(D|A) = ' + terms + '\n              = ' + fmt(r.cond) + '\n' +
            '信息增益 g = ' + fmt(HD) + ' − ' + fmt(r.cond) + ' = <b>' + fmt(r.gain) + '</b>\n' +
            '划分熵 HA = ' + fmt(r.ha) + '（只看各组大小）\n' +
            '增益比 gR = ' + fmt(r.gain) + '/' + fmt(r.ha) + ' = <b>' + fmt(r.gr) + '</b></div>';
        });
      })(trs[ti]);
    }
    c3.appendChild(el("p", "sub", "点表格任意一行，看这一行的逐步计算。"));
    c3.appendChild(el("div", "note ok", "<b>结论：</b>按信息增益选「房产」（0.420 最大）。有房组 6 人全批准，已成纯节点直接判批准；无房组只拿剩下的 9 人继续按「工作」划分。" +
      "<br><b>注意分母：</b>这一步的分母是 <b>9</b>，不是 15。已经离开当前分支的那 6 个人不用再计入——这是决策树手算题最常见的错。"));
    c3.appendChild(el("div", "note", "<b>一个巧合别慌：</b>房产的划分熵 0.971 恰好等于父节点熵 0.971。原因是分支比例 6:9 和类别比例 9:6 互为交换，而熵对交换不敏感。"));
    root.appendChild(c3);

    /* --- 三者关系 --- */
    root.appendChild(el("h3", null, "④ 熵 / 交叉熵 / KL 三者关系"));
    var c4 = el("div", "card");
    c4.innerHTML = '<div class="formula">D_KL(p‖q) = Σ pₖ ln(pₖ/qₖ) = H(p,q) − H(p)</div>' +
      '<div class="note"><b>验算 p=q=(½,½)：</b>KL = 0；交叉熵 = ln2 ≈ 0.693；H(p) 也是 ln2；KL = ln2 − ln2 = 0 ✓<br>' +
      '这个例子说明「交叉熵不为 0」和「预测完全正确」可以同时成立。</div>' +
      '<table class="tbl"><tr><th>区别</th><th style="text-align:left">内容</th></tr>' +
      '<tr><td>底数</td><td style="text-align:left">树题用 log₂（bit），分类损失用 ln（nat）。题目指定就按题目</td></tr>' +
      '<tr><td>最小值</td><td style="text-align:left">交叉熵最小值不一定为 0。q=p 时取到 H(p)；只有 one-hot 时理想损失才是 0</td></tr>' +
      '<tr><td>对称性</td><td style="text-align:left">KL 不对称 ⚠ 不是距离。它衡量「用 q 近似 p 多付的编码代价」</td></tr></table>';
    root.appendChild(c4);

    root.appendChild(el("h3", null, "模拟卷第 9 题原题"));
    var c5 = el("div", "card");
    c5.innerHTML = '<p>节点正负各 4 个。A 分 (3正,0负)、(1正,4负)；B 分 (3正,1负)、(1正,3负)。</p>' +
      '<div class="formula">父节点：4 正 4 负 → H(D) = <b>1 bit</b>\n\n' +
      'A：第一组纯 → H=0；第二组 (1/5,4/5) → H≈0.722\n' +
      '   H(D|A) = (3/8)×0 + (5/8)×0.722 ≈ <b>0.451</b>\n' +
      '   g(A) = 1 − 0.451 = <b>0.549</b>\n' +
      '   HA(3:5) ≈ 0.954　→ gR(A) ≈ <b>0.575</b>\n\n' +
      'B：两组都是 (3/4,1/4) → H ≈ 0.811\n' +
      '   H(D|B) = 0.5×0.811 + 0.5×0.811 ≈ <b>0.811</b>\n' +
      '   g(B) = 1 − 0.811 = <b>0.189</b>\n' +
      '   HA(4:4) = 1　→ gR(B) = <b>0.189</b></div>' +
      '<div class="note ok">ID3 比信息增益 → 选 <b>A</b>（0.549 &gt; 0.189）。按增益比也是 A（0.575 &gt; 0.189），两个判据一致。</div>' +
      '<div class="note warn"><b>答题提示：</b>熵的运算全程保留 5 位以上中间位数，最后统一四舍五入到三位。中途就舍入，误差会累积到增益比上。</div>';
    root.appendChild(c5);
  }
});
