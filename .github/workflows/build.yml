name: Build APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 仓库里刻意没有 gradle-wrapper.jar（二进制不好用网页上传），
      # 这里由 action 下载 Gradle 8.7 并加进 PATH；AGP 8.5.2 的官方最低要求就是 8.7
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Collect APK
        run: |
          mkdir -p out
          ls -l app/build/outputs/apk/debug/
          cp app/build/outputs/apk/debug/app-debug.apk out/ML9-debug.apk
          du -h out/ML9-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ML9-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Attach APK to Release (tag push only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          body: |
            机器学习 9 个考点 · 可交互学习版（WebView 单文件，离线可用，明暗双主题）。
            下载 `ML9-debug.apk` 传到手机安装即可。
